[project]
name = "p3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FabianDepagne", email = "fabian.lobato@depagne.fr" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
p3 = "p3:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
